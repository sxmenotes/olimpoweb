backend:
  name: github
  repo: sxmenotes/olimpoweb
  branch: main
  auth_endpoint: api/auth
media_folder: "img"
public_folder: "/img"

collections:
  - name: "pages"
    label: "Páginas"
    files:
      - file: "data/content.json"
        label: "Inicio"
        name: "home"
        fields:
          - label: "Sección Inicio (Hero)"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Título Principal", name: "title", widget: "string", default: "Donde cada celebración cobra vida"}
              - {label: "Subtítulo", name: "subtitle", widget: "text", default: "Experimente la fusión de la elegancia clásica y la energía contemporánea en el centro de eventos más exclusivo de Curicó."}
              - {label: "Imagen de Fondo", name: "image", widget: "image", required: false}

          - label: "Sección El Espacio"
            name: "space"
            widget: "object"
            fields:
              - {label: "Título Principal", name: "title", widget: "string", default: "El Espacio"}
              - {label: "Texto Principal", name: "text", widget: "text", default: "Sumérjase en nuestra inconfundible arquitectura de estilo griego, diseñada para crear un ambiente elegante, diferente y de altísimo nivel. Nuestro complejo cuenta con hermosas y amplias áreas verdes, piscina y un exclusivo Apart Hotel pensado para el descanso y la máxima comodidad de sus invitados."}
              - {label: "Imagen Salón Olimpo", name: "image_olimpo", widget: "image", required: false}
              - {label: "Imagen Salón Apolo", name: "image_apolo", widget: "image", required: false}
              - {label: "Imagen Salón Dionisio", name: "image_dionisio", widget: "image", required: false}

          - label: "Sección Servicios"
            name: "services"
            widget: "object"
            fields:
              - {label: "Foto Gastronomía", name: "image_gastronomia", widget: "image", required: false}
              - {label: "Foto Ambientación", name: "image_ambientacion", widget: "image", required: false}
              - {label: "Foto Wedding Planner", name: "image_wedding", widget: "image", required: false}

          - label: "Sección Galería"
            name: "gallery"
            widget: "list"
            fields:
              - {label: "Foto", name: "image", widget: "image"}
              
          - label: "Sección Nuestro Sello"
            name: "sello"
            widget: "object"
            fields:
              - {label: "Título Principal", name: "title", widget: "string", default: "Nuestro Sello"}
              - {label: "Subtítulo", name: "subtitle", widget: "string", default: "Una experiencia diferente"}
              - {label: "Párrafo 1", name: "paragraph1", widget: "text"}
              - {label: "Párrafo 2", name: "paragraph2", widget: "text"}
              - {label: "Párrafo 3", name: "paragraph3", widget: "text"}
              - {label: "Párrafo 4", name: "paragraph4", widget: "text"}
              - {label: "Título de Firma", name: "founder_title", widget: "string", default: "Olimpo Centro de Eventos"}
              - {label: "Slogan", name: "slogan", widget: "string", default: "Tu celebración. Nuestro compromiso. Una experiencia inolvidable."}
              - {label: "Foto Fundadora", name: "image", widget: "image"}
              - {label: "Leyenda Foto", name: "image_caption", widget: "string", default: "Patricia Castillo, Fundadora de Centro de Eventos Olimpo"}
